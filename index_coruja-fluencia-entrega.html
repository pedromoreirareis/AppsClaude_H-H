      :root {
        --bg-1: #1e1b4b;
        --bg-2: #090e18;
        --ouro: #fbbf24;
        --ouro-esc: #b45309;
        --verde: #10b981;
        --verde-esc: #047857;
        --vermelho: #ef4444;
        --vermelho-esc: #991b1b;
        --azul: #38bdf8;
        --azul-esc: #1e40af;
        --roxo: #a855f7;
        --roxo-esc: #581c87;
        --laranja: #fb923c;
        --laranja-esc: #c2410c;
        --cinza: #94a3b8;
        --cinza-esc: #475569;
        --texto: #f1f5f9;
        --texto-fraco: #94a3b8;
        --papel: #fdfbf5;
        --tinta: #14181f;
        /* variáveis "semânticas" de superfície — usadas em TODO botão,
           cartão e borda sutil do app. Cada tema define seu próprio
           valor. Nunca mais usar rgba(255,255,255,X) direto num
           componente: em tema claro isso vira branco-sobre-branco.
           Existir esse nível de indireção é o que garante que um tema
           novo nunca quebra contraste sem eu ter que caçar cada
           componente um por um. */
        --superficie: rgba(255, 255, 255, 0.07);
        --superficie-2: rgba(255, 255, 255, 0.1);
        --borda-fraca: rgba(255, 255, 255, 0.16);
        --destaque-texto: #fbbf24;
        --erro-texto: #fca5a5;
        --silabou-texto: #fdba74;
        --azul-texto: #38bdf8;
        --roxo-texto: #c084fc;
        --sucesso-texto: #6ee7b7;
        --fonte: "Arial Rounded MT Bold", "Baloo 2", Nunito, "Segoe UI Rounded", system-ui, Arial, sans-serif;
        --fonte-leitura: "Arial Rounded MT Bold", "Baloo 2", Nunito, sans-serif;
        --transform-palavra: capitalize;
      }

        --tinta: #1e1b3a;
        --ouro: #fbbf24;
        --superficie: rgba(255, 255, 255, 0.14);
        --superficie-2: rgba(255, 255, 255, 0.2);
        --borda-fraca: rgba(255, 255, 255, 0.32);
        --erro-texto: #fca5a5;
        --silabou-texto: #fdba74;
        --azul-texto: #38bdf8;
        --roxo-texto: #f9a8d4;
        --destaque-texto: #5eead4;
        --sucesso-texto: #6ee7b7;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: var(--fonte);
        background: var(--bg-2);
        color: var(--texto);
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }

      /* =========================================================
         PAISAGEM FORÇADA: quando o navegador reporta um viewport
         "de pé" (largura <= altura) — o que também acontece quando
         a rotação automática do Android está DESLIGADA, já que aí
         o navegador nunca gira o viewport mesmo com o aparelho
         deitado — o app inteiro é rotacionado por CSS, sem depender
         de sensor nenhum. É a mesma técnica usada nos outros
         aplicativos da família.
         ========================================================= */
      #giro {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      @media (max-aspect-ratio: 1/1) {
        #giro {
          width: 100vh;
          height: 100vw;
          position: fixed;
          top: 0;
          left: 0;
          transform: rotate(90deg) translateY(-100vw);
          transform-origin: top left;
        }
      }

      /* ---------- botões flutuantes globais (engrenagem + tela cheia) ---------- */
      #btn-tela-cheia,
      #btn-config-flutuante {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        z-index: 999999;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(10, 14, 24, 0.55);
        color: #fff;
        font-size: 1.05rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(3px);
      }
      #btn-tela-cheia {
        right: max(8px, env(safe-area-inset-right));
      }
      /* engrenagem fica À ESQUERDA da tela cheia, como nos outros apps da família */
      #btn-config-flutuante {
        right: calc(max(8px, env(safe-area-inset-right)) + 46px);
        font-size: 1.15rem;
      }
      #btn-tela-cheia:active,
      #btn-config-flutuante:active {
        transform: scale(0.92);
      }
      #btn-tela-cheia.escondido,
      #btn-config-flutuante.escondido {
        display: none;
      }

      /* instalar na tela inicial e "convite" agora são o próprio
         escola-pwa.js (mesmo padrão dos outros aplicativos da família) */

      /* pontinho de status da nuvem, em cima da engrenagem */
      .nuvem-ponto {
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 2px solid var(--bg-2);
        display: none;
        box-shadow: 0 1px 3px #0005;
        pointer-events: none;
      }
      .nuvem-ponto.on { display: block; background: #f0a030; }
      .nuvem-ponto.on.ok { background: #2fb35a; }
      .nuvem-ponto.on.erro { background: #e23b3b; }
      .nuvem-ponto.on.espera { background: #f0a030; }

      #app {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, var(--bg-1) 20%, var(--bg-2) 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        overflow-y: auto;
      }

      .tela {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 16px 44px;
        max-width: 1100px;
        width: 100%;
        margin: auto;
      }
      @media (orientation: landscape) {
        .tela {
          gap: 11px;
          padding: 12px 40px;
        }
      }

      h1 {
        font-size: clamp(1.4rem, 5.4vw, 2.2rem);
        font-weight: 900;
        margin: 0;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
      }
      @media (orientation: landscape) {
        h1 {
          font-size: clamp(1.1rem, 3.4vw, 1.6rem);
        }
      }

      h2 {
        font-size: clamp(1.1rem, 4.4vw, 1.5rem);
        font-weight: 900;
        margin: 0;
      }

      p.sub {
        color: var(--texto-fraco);
        font-weight: 800;
        font-size: 0.92rem;
        margin: 0;
        line-height: 1.4;
      }

      .btn {
        font-family: inherit;
        font-weight: 900;
        border-radius: 20px;
        border: 3px solid #fff;
        cursor: pointer;
        color: #fff;
        padding: 13px 24px;
        font-size: 1.02rem;
        transition: transform 0.12s;
      }
      .btn:active {
        transform: translateY(3px);
      }
      .btn:focus-visible {
        outline: 3px solid var(--ouro);
        outline-offset: 3px;
      }
      .btn-ouro {
        background: linear-gradient(180deg, #fbbf24, #d97706);
        box-shadow: 0 6px 0 var(--ouro-esc);
        color: #3b2306;
      }
      .btn-verde {
        background: linear-gradient(180deg, #34d399, #059669);
        box-shadow: 0 6px 0 var(--verde-esc);
      }
      .btn-azul {
        background: linear-gradient(180deg, #38bdf8, #2563eb);
        box-shadow: 0 6px 0 var(--azul-esc);
      }
      .btn-roxo {
        background: linear-gradient(180deg, #a855f7, #7e22ce);
        box-shadow: 0 6px 0 var(--roxo-esc);
      }
      .btn-fantasma {
        background: none;
        border: none;
        color: var(--texto-fraco);
        font-weight: 800;
        font-size: 0.92rem;
        box-shadow: none;
        padding: 8px 14px;
      }
      .btn-contorno {
        background: var(--superficie);
        border: 3px solid var(--borda-fraca);
        color: var(--texto);
        box-shadow: none;
      }

      input[type="text"] {
        font-family: inherit;
        font-size: 1.35rem;
        font-weight: 900;
        text-align: center;
        padding: 11px 18px;
        border-radius: 18px;
        border: 3px solid var(--ouro);
        background: rgba(255, 255, 255, 0.95);
        color: #1e293b;
        outline: none;
        width: 100%;
        max-width: 320px;
        user-select: text;
        -webkit-user-select: text;
      }

      .cartao {
        background: linear-gradient(180deg, var(--superficie-2), var(--superficie));
        border-radius: 22px;
        padding: 14px 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 120px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        border: 3px solid var(--azul);
        font-family: inherit;
        transition: transform 0.15s;
        color: var(--texto);
      }
      .cartao:active {
        transform: scale(0.96);
      }

      .grade-emoji {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: center;
        gap: clamp(3px, 1.2vw, 8px);
        width: 100%;
        max-width: 98vw;
      }
      .emoji-op {
        --t: clamp(30px, min(9.5vw, 13vh), 58px);
        width: var(--t);
        height: var(--t);
        font-size: calc(var(--t) * 0.58);
        flex: 0 0 auto;
      }
      .emoji-op,
      .idade-op {
        background: var(--superficie-2);
        border: 3px solid transparent;
        border-radius: 14px;
        padding: 5px 0;
        cursor: pointer;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        color: var(--texto);
        font-weight: 900;
      }
      .idade-op {
        font-size: 1rem;
        aspect-ratio: auto;
        padding: 8px 0;
      }
      /* teclado aberto (tela baixinha): o grupo de bichinhos nunca pode
         quebrar linha nem ficar pequeno demais pra tocar */
      @media (max-height: 300px) {
        .emoji-op { --t: clamp(30px, min(9.5vw, 20vh), 58px); }
      }
      .grade-idade {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 5px;
        width: 100%;
        max-width: 460px;
      }
      .grade-serie {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        width: 100%;
        max-width: 480px;
      }
      .serie-op {
        font-size: 0.82rem;
        background: var(--superficie-2);
        border: 3px solid transparent;
        border-radius: 14px;
        padding: 9px 4px;
        cursor: pointer;
        font-family: inherit;
        color: var(--texto);
        font-weight: 900;
      }
      .nivel-op {
        font-size: 0.85rem;
        background: var(--superficie-2);
        border: 3px solid transparent;
        border-radius: 14px;
        padding: 10px 14px;
        cursor: pointer;
        font-family: inherit;
        color: var(--texto);
        font-weight: 900;
      }
      .sel {
        border-color: var(--ouro) !important;
        background: rgba(251, 191, 36, 0.25) !important;
        transform: scale(1.08);
      }
      /* ---------- overlay: gire o aparelho (REMOVIDO — agora é paisagem forcada por CSS) ---------- */

      /* ---------- superfície de leitura: minimalista de propósito ---------- */
      #tela-teste {
        position: fixed;
        inset: 0;
        background: var(--bg-2);
        display: none;
        flex-direction: column;
        z-index: 200;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #barra-topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px 8px;
        gap: 12px;
        flex: 0 0 auto;
      }
      #chip-crianca {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--superficie);
        border-radius: 999px;
        padding: 6px 14px 6px 8px;
        flex: 0 0 auto;
        max-width: 34%;
        overflow: hidden;
      }
      #chip-crianca .em { font-size: 1.35rem; flex: 0 0 auto; }
      #chip-crianca .tx { text-align: left; overflow: hidden; }
      #chip-crianca .nome { font-weight: 900; font-size: 0.9rem; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #chip-crianca .serie { font-weight: 700; font-size: 0.76rem; color: var(--texto-fraco); white-space: nowrap; }

      #meio-topo {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      #relogio {
        font-weight: 900;
        font-size: 1.5rem;
        color: var(--ouro);
        min-width: 58px;
        font-variant-numeric: tabular-nums;
        flex: 0 0 auto;
      }
      #trilho {
        flex: 1;
        height: 13px;
        background: var(--superficie-2);
        border-radius: 999px;
        overflow: hidden;
      }
      #preenche {
        height: 100%;
        width: 100%;
        background: #34d399;
        border-radius: 999px;
        transition: background-color 0.6s linear;
      }
      #contador {
        font-weight: 900;
        font-size: 0.9rem;
        color: var(--texto-fraco);
        min-width: 18px;
        flex: 0 0 auto;
      }

      #papel {
        flex: 1;
        margin: 4px 16px 10px;
        background: var(--papel);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        min-height: 0;
        border: 4px solid transparent;
        position: relative;
      }
      /* modo pseudopalavras: borda tracejada roxa, pra ficar visualmente
         claro que aquela "palavra" é inventada, não de verdade */
      #papel.papel-pseudo {
        border: 4px dashed #a855f7;
      }
      /* contagem regressiva antes do minuto comecar -- cobre a palavra
         (que ja esta pronta por baixo) ate a crianca se preparar */
      #contagem-regressiva,
      .overlay-contagem {
        display: none;
        position: absolute;
        inset: 0;
        background: #090e18;
        border-radius: 20px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        z-index: 5;
      }
      #contagem-numero,
      .numero-contagem {
        font-size: clamp(4rem, 22vw, 9rem);
        font-weight: 900;
        color: var(--ouro);
        line-height: 1;
        animation: contagem-pulso 1s ease-out;
      }
      @keyframes contagem-pulso {
        0% { transform: scale(1.5); opacity: 0; }
        30% { transform: scale(1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      #palavra {
        font-size: clamp(2.4rem, 10.5vw, 5.8rem);
        font-weight: 800;
        color: var(--tinta);
        letter-spacing: 0.01em;
        line-height: 1.1;
        word-break: break-word;
        font-family: var(--fonte-leitura);
        text-transform: var(--transform-palavra);
      }

      /* ---------- leitura de frases: texto corrido ---------- */
      #tela-frases {
        position: fixed;
        inset: 0;
        background: var(--bg-2);
        display: none;
        flex-direction: column;
        z-index: 200;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #papel-frases {
        flex: 1;
        margin: 4px 16px 8px;
        background: var(--papel);
        border-radius: 24px;
        padding: 18px 22px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        overflow-y: auto;
        min-height: 0;
        position: relative;
      }
      #frases-titulo {
        font-family: var(--fonte-leitura);
        font-weight: 900;
        color: var(--tinta);
        font-size: 1.1rem;
        margin-bottom: 10px;
        opacity: 0.75;
      }
      #frases-corpo {
        font-family: var(--fonte-leitura);
        color: var(--tinta);
        font-size: 2.2rem;
        line-height: 2.1;
        text-transform: var(--transform-palavra);
        position: relative;
      }
      #frases-corpo .fpalavra {
        display: inline-block;
        padding: 1px 3px;
        border-radius: 5px;
        cursor: pointer;
        position: relative;
      }
      #frases-corpo .fpalavra.erro {
        background: rgba(239, 68, 68, 0.22);
        text-decoration: line-through;
        text-decoration-color: #dc2626;
        text-decoration-thickness: 3px;
      }
      /* linhas alternadas: uma barra de fundo por trás de CADA LINHA
         inteira (borda a borda), não uma cor por palavra — feito como
         elemento separado, absoluto, atrás do texto, porque a única
         forma de pintar "a linha toda" é medir onde ela realmente ficou
         depois do navegador quebrar o texto (isso muda com o tamanho
         da fonte e a largura da tela) */
      .linha-fundo {
        position: absolute;
        left: 0;
        right: 0;
        background: rgba(96, 165, 250, 0.22);
        border-radius: 8px;
        pointer-events: none;
        z-index: 0;
      }
      #frases-corpo .fpalavra {
        position: relative;
        z-index: 1;
      }
      #frases-corpo .fpalavra.marca10::after {
        content: attr(data-marca);
        position: absolute;
        top: -14px;
        right: -2px;
        font-size: 0.6rem;
        font-weight: 900;
        color: var(--tinta);
        opacity: 0.55;
      }
      #frases-corpo .fpalavra.alvo-parada {
        outline: 3px solid var(--ouro);
        background: rgba(251, 191, 36, 0.3);
      }
      #tela-frases.frases-modo-parada #frases-corpo .fpalavra:not(.erro) {
        cursor: pointer;
      }
      #aviso-parada {
        display: none;
        text-align: center;
        font-weight: 900;
        color: var(--ouro);
        background: rgba(251, 191, 36, 0.12);
        border: 2px dashed var(--ouro);
        border-radius: 14px;
        padding: 8px;
        margin: 0 16px 6px;
        font-size: 0.85rem;
      }
      #tela-frases.frases-modo-parada #aviso-parada {
        display: block;
      }
      #frases-rodape {
        display: flex;
        gap: 10px;
        justify-content: center;
        padding: 0 16px 10px;
        flex: 0 0 auto;
      }

      #botoes-juiz {
        display: flex;
        gap: 8px;
        padding: 0 16px 10px;
        flex: 0 0 auto;
      }
      .btn-juiz {
        border-radius: 18px;
        border: 3px solid #fff;
        font-family: inherit;
        font-weight: 900;
        color: #fff;
        cursor: pointer;
        padding: 12px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        transition: transform 0.1s;
      }
      .btn-juiz:active {
        transform: translateY(3px);
      }
      #btn-errou {
        flex: 0.9;
        background: linear-gradient(180deg, #f87171, #dc2626);
        box-shadow: 0 6px 0 var(--vermelho-esc);
      }
      #btn-silabou {
        flex: 1.05;
        background: linear-gradient(180deg, #fb923c, #c2410c);
        box-shadow: 0 6px 0 #9a3412;
      }
      #btn-certo {
        flex: 1.35;
        background: linear-gradient(180deg, #34d399, #059669);
        box-shadow: 0 6px 0 var(--verde-esc);
      }
      .btn-juiz span.ico {
        font-size: 1.35rem;
      }
      .btn-juiz span.leg {
        font-size: 0.8rem;
        font-weight: 800;
        opacity: 0.94;
      }
      #linha-rodape {
        text-align: center;
        padding: 0 0 6px;
        flex: 0 0 auto;
      }

      /* ---------- painel de configurações (grande, com pré-visualização) ---------- */
      #modal-config,
      #modal-popup {
        position: fixed;
        inset: 0;
        z-index: 500000;
        background: rgba(5, 8, 15, 0.92);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      #modal-popup {
        z-index: 600000;
      }
      .config-caixa {
        background: var(--bg-1);
        border: 3px solid var(--borda-fraca);
        border-radius: 26px;
        padding: 20px 22px;
        max-width: 760px;
        width: 100%;
        max-height: 94vh;
        overflow-y: auto;
        text-align: left;
      }
      .popup-caixa {
        background: var(--bg-1);
        border: 3px solid var(--borda-fraca);
        border-radius: 26px;
        padding: 24px;
        max-width: 460px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        text-align: center;
      }
      /* teclado aberto / tela baixinha: encolhe o pop-up e some com o
         que é só enfeite, pra sempre dar pra ver o que está digitando
         (mesma técnica usada no Curiosidades e na Alfabetização) */
      @media (max-height: 300px) {
        .popup-caixa { padding: 10px 18px; }
        .popup-caixa h2 { margin: 0 0 4px; font-size: 1rem; }
        #cod-fam-icone, #cod-fam-texto { display: none; }
      }
      .config-titulo {
        font-weight: 900;
        color: var(--ouro);
        font-size: 0.84rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 16px 0 8px;
      }
      .config-titulo:first-of-type { margin-top: 0; }
      .config-opcoes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .config-op {
        border: 3px solid transparent;
        background: var(--superficie);
        color: var(--texto);
        border-radius: 14px;
        padding: 10px 15px;
        font-weight: 800;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .config-op.sel {
        border-color: var(--ouro);
        background: rgba(251, 191, 36, 0.2);
      }
      #range-tamanho {
        width: 100%;
        accent-color: var(--ouro);
        height: 26px;
      }
      /* controles com botão − à esquerda e + à direita, ao lado de uma
         barra deslizante — pra ficar óbvio quando o valor sobe ou desce,
         além de arrastar a barra */
      .linha-passo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn-passo {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid var(--ouro);
        background: rgba(251, 191, 36, 0.14);
        color: var(--ouro);
        font-size: 1.4rem;
        font-weight: 900;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .btn-passo:active {
        transform: scale(0.92);
      }
      .btn-passo:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .linha-passo input[type="range"] {
        flex: 1;
        /* a barra é só um indicador visual do valor atual — o valor só
           muda pelos botões − e +. Um toque leve arrastando a barra em
           si não deve mudar nada (uma criança pequena esbarra fácil). */
        pointer-events: none;
      }
      .config-toggle-linha {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--superficie);
        border-radius: 14px;
        padding: 10px 14px;
        margin-bottom: 8px;
        font-weight: 800;
        font-size: 0.88rem;
        color: var(--texto);
      }
      .toggle-pill {
        border: 3px solid var(--borda-fraca);
        background: var(--superficie);
        border-radius: 999px;
        padding: 6px 16px;
        font-weight: 900;
        font-size: 0.8rem;
        color: var(--texto);
        cursor: pointer;
      }
      .toggle-pill.ligado {
        background: rgba(52, 211, 153, 0.22);
        border-color: #10b981;
        color: var(--sucesso-texto);
      }

      /* pré-visualização de fonte no popup de configurações */
      #preview-fonte-caixa {
        background: var(--papel);
        border-radius: 18px;
        padding: 14px 10px;
        margin: 6px 0 4px;
        text-align: center;
        overflow: hidden;
      }
      #preview-fonte-palavra {
        color: var(--tinta);
        font-weight: 800;
        letter-spacing: 0.01em;
        line-height: 1.1;
        word-break: break-word;
      }

      /* ---------- passos "como funciona" em grade ---------- */
      .passos-grade {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
        max-width: 960px;
      }
      @media (max-width: 560px) {
        .passos-grade { grid-template-columns: 1fr; }
      }
      .passo {
        background: var(--superficie);
        border-radius: 16px;
        padding: 10px 12px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        text-align: left;
      }
      .passo .num {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #f59e0b;
        color: #3b2306;
        font-weight: 900;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .passo p {
        margin: 0;
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--texto);
        line-height: 1.35;
      }

      /* ---------- relatório ---------- */
      .painel {
        background: var(--superficie);
        border: 3px solid var(--borda-fraca);
        border-radius: 22px;
        padding: 16px;
        width: 100%;
        text-align: left;
      }
      /* menu principal: os 3 modos lado a lado, aproveitando a largura
         da tela em paisagem em vez de empilhar (empilhado, cada botão
         ficava enorme e ainda cortava o resto da tela, forçando rolar) */
      .grade-modos {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: 100%;
        max-width: 1000px;
      }
      .grade-modos .btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 14px 8px;
        min-height: 108px;
        justify-content: center;
      }
      .grade-modos .modo-ico { font-size: 1.7rem; line-height: 1; }
      .grade-modos .modo-titulo { font-size: 0.98rem; font-weight: 900; line-height: 1.15; }
      .grade-modos .modo-sub { font-size: 0.78rem; font-weight: 800; opacity: 0.9; line-height: 1.25; }
      .linha-inferior-menu {
        display: flex;
        align-items: stretch;
        gap: 10px;
        width: 100%;
        max-width: 1000px;
      }
      .boas-vindas-linha {
        display: flex;
        align-items: center;
        gap: 22px;
        justify-content: center;
      }
      @media (max-width: 640px) {
        .grade-modos { grid-template-columns: 1fr; }
        .linha-inferior-menu { flex-direction: column; }
      }
      .linha {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 1px dashed var(--borda-fraca);
        font-weight: 800;
        font-size: 0.93rem;
      }
      .linha:last-child {
        border-bottom: none;
      }
      .linha .v {
        color: var(--ouro);
        font-weight: 900;
        text-align: right;
      }
      .destaque {
        font-size: 3.4rem;
        font-weight: 900;
        color: var(--ouro);
        line-height: 1;
      }
      .tag {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 900;
        font-size: 0.88rem;
        border: 2px solid transparent;
        color: #fff;
      }
      /* pílulas de cor sólida (não fundo diluído + texto claro) — assim
         o contraste fica garantido em QUALQUER tema, porque a própria
         pílula carrega cor forte o bastante pra texto branco em cima,
         igual os botões grandes já funcionavam */
      .t-ins { background: #dc2626; }
      .t-dev { background: #ea580c; }
      .t-adq { background: #059669; }
      .t-ava { background: #2563eb; }
      .t-sobe { background: #059669; }
      .t-mantem { background: #ea580c; }
      .t-desce { background: #2563eb; }
      .chip {
        display: inline-block;
        border-radius: 999px;
        padding: 4px 11px;
        margin: 3px;
        font-weight: 800;
        font-size: 0.86rem;
        border: 2px solid;
      }
      .chip-ok {
        background: #059669;
        border-color: transparent;
        color: #fff;
      }
      .chip-erro {
        background: #dc2626;
        border-color: transparent;
        color: #fff;
      }
      .chip-pulo {
        background: #64748b;
        border-color: transparent;
        color: #fff;
      }
      .chip-sil {
        background: #ea580c;
        border-color: transparent;
        color: #fff;
      }
      .rolavel { width: 100%; }
      .aviso {
        font-size: 0.78rem;
        color: var(--texto-fraco);
        font-weight: 700;
        line-height: 1.5;
        text-align: left;
      }
      .oculto { display: none !important; }

      @keyframes pulsa {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.07); }
      }
      .pulsa { animation: pulsa 1.6s infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }

      /* textos curtos calibrados por idade (6-12 anos), pra leitura de

      const TEXTOS = {"6":[["A Formiga Trabalhadora","Lili é uma formiga pequena. Ela mora em um formigueiro grande. Todo dia, Lili sai cedo para buscar comida. Ela encontra uma folha verde no jardim. A folha é maior do que ela! Lili não desiste. Ela puxa a folha com força. Aos poucos, a folha se move. Lili leva a folha até o formigueiro. As outras formigas ficam felizes. Elas vão comer bem hoje. Lili sorri. O esforço dela valeu a pena. Trabalhar com força sempre ajuda. Amanhã, Lili vai buscar mais comida de novo. Ela gosta muito de ajudar o seu grupo todo dia."],["O Cachorro Perdido","Um cachorro pequeno andava sozinho na rua. Ele estava com fome e com medo. João viu o cachorro e chamou ele com calma. O cachorro chegou perto devagar. João deu água e comida para ele. Depois, João olhou a coleira. Nela tinha um nome e um telefone. A mãe de João ligou para o dono. Em pouco tempo, uma moça chegou correndo. Era a dona do cachorro! Ela estava procurando ele desde cedo. O cachorro pulou de alegria quando viu ela. A moça agradeceu muito o menino. João ficou feliz de ter ajudado. Ele aprendeu que ajudar faz bem para todo mundo."],["A Horta da Vovó","A vovó tem uma horta atrás da casa. Nela crescem alface, tomate e cenoura. Todo sábado, Maria vai ajudar a vovó. Elas tiram o mato e colocam água nas plantas. Maria gosta de cavar a terra com a pá. Um dia, ela achou uma minhoca gorda. A vovó falou que a minhoca é boa para a terra. Ela deixa a terra fofa e as plantas crescem melhor. Maria ficou surpresa com isso. Depois, elas colheram tomates bem vermelhos. No almoço, comeram uma salada gostosa. Maria contou para todos que ela mesma plantou. O esforço dela deu um resultado muito bom."],["O Pião Colorido","Pedro ganhou um pião do seu avô. O pião era de madeira e tinha muitas cores. Pedro tentou rodar o pião no chão. Na primeira vez, o pião caiu logo. Na segunda vez, caiu de novo. Pedro ficou triste e quase parou. O avô falou para ele tentar mais uma vez. Ele mostrou como jogar o barbante certo. Pedro tentou devagar, com calma. Dessa vez, o pião rodou e rodou! Todos bateram palma para ele. Pedro sorriu bem grande. Ele viu que treinar dá certo. Agora ele roda o pião todo dia no quintal."]],"7":[["O Gato Curioso","Marola era um gato cinza que morava perto de um rio. Todos os dias, ele observava os peixes nadando na água clara. Um dia, Marola decidiu se aproximar mais da margem para ver melhor. De repente, ele viu algo brilhante embaixo de uma pedra grande. Curioso, o gato tentou tirar o objeto com a pata. Era uma moeda antiga, cheia de desenhos estranhos! Marola levou a moeda para casa e mostrou para a sua dona. Ela ficou muito surpresa e disse que aquela moeda era muito especial. Desde aquele dia, Marola sempre voltava ao rio para procurar outros tesouros escondidos. Ele aprendeu que prestar atenção nos detalhes pode trazer boas descobertas."],["A Bicicleta Nova","Lucas ganhou uma bicicleta azul no seu aniversário. Ele nunca tinha andado de bicicleta sozinho antes. No começo, seu pai segurava o banco enquanto ele pedalava devagar pela calçada. Lucas ficava nervoso e balançava bastante de um lado para o outro. Depois de muitas tentativas, ele começou a entender como manter o equilíbrio. Um dia, seu pai soltou a bicicleta sem avisar nada. Lucas pedalou sozinho por vários metros antes de perceber! Quando percebeu, ficou tão animado que quase caiu. Ele parou, olhou para trás e viu o pai sorrindo de longe. Naquele momento, Lucas entendeu que já sabia andar. Agora ele pedala todos os dias na praça perto de casa."],["O Ninho no Quintal","Ana descobriu um ninho na árvore do quintal de sua casa. Dentro dele havia três ovinhos azuis, muito pequenos e delicados. Ela quis pegar um ovo para ver de perto, mas sua mãe explicou que não podia. Se ela tocasse nos ovos, a mãe passarinho poderia abandonar o ninho. Ana decidiu apenas observar de longe todos os dias. Uma semana depois, os ovos rachavam e três filhotes apareceram. Eles eram feios, sem penas, e piavam o tempo todo pedindo comida. A mãe passarinho voava sem parar buscando minhocas para eles. Aos poucos, os filhotes cresceram e ganharam penas macias. Um dia, eles voaram para longe. Ana sentiu saudade, mas ficou contente por ter cuidado bem deles."],["A Feira de Sábado","Todo sábado de manhã, Miguel vai à feira com sua avó. Eles saem cedo, quando as barracas ainda estão sendo montadas na rua. O cheiro de pão e de frutas frescas toma conta de tudo. Miguel adora ver as pilhas coloridas de laranja, banana e melancia. Sua avó sempre conversa com os feirantes, que já conhecem ela pelo nome. Ela ensina o menino a escolher as frutas maduras apertando de leve. Miguel carrega a sacola, mesmo quando fica pesada demais. No final, eles sempre param na barraca de pastel. Miguel escolhe o de queijo e sua avó pede o de carne. Sentados no banco da praça, eles comem juntos e conversam. Esse é o momento favorito da semana dele."]],"8":[["A Chuva que Não Parava","Durante três dias seguidos, choveu sem parar na pequena cidade onde Beto morava. As ruas ficaram cheias de poças, e o rio próximo começou a subir de nível aos poucos. Beto observava tudo pela janela, preocupado com o jardim que ele e sua avó cuidavam com tanto carinho havia anos. No quarto dia, finalmente o sol apareceu entre as nuvens cinzentas que cobriam o céu. Beto correu para o quintal e ficou surpreso: apesar da chuva forte, as plantas pareciam mais verdes do que nunca antes. Sua avó explicou que a água, mesmo em excesso, pode ajudar a natureza a se renovar quando existe equilíbrio. Beto entendeu que nem tudo que parece ruim no começo continua sendo ruim depois de um tempo. Ele aprendeu a ter paciência diante das dificuldades e confiar que as coisas se ajeitam."],["O Time da Escola","Sofia queria muito entrar no time de vôlei da escola, mas tinha medo de não ser boa o bastante. Nos treinos abertos, ela errava vários saques e ficava vermelha de vergonha na frente dos colegas. A professora percebeu o desânimo da menina e chamou ela para conversar depois da aula. Explicou que todo mundo ali estava aprendendo, inclusive as jogadoras mais antigas do grupo. Sofia decidiu continuar tentando, mesmo sem se sentir confiante. Ela passou a treinar sozinha em casa, batendo a bola contra a parede do quintal. Depois de algumas semanas, seus saques ficaram mais firmes e certeiros. No dia da seleção final, Sofia acertou quase todos os saques que tentou. Ela entrou para o time e comemorou muito com a família. Mais importante do que ser escolhida, Sofia descobriu que treinar com paciência funciona."],["A Caixa de Ferramentas","O pai de Rafael guardava uma caixa de ferramentas antiga na garagem, herdada do avô dele. Rafael sempre teve curiosidade sobre aquele objeto pesado, cheio de peças que ele não sabia nomear. Certo dia, a cadeira da cozinha quebrou uma perna e ficou toda torta. Seu pai pegou a caixa e chamou o menino para ajudar no conserto. Juntos, eles escolheram os parafusos certos e a chave do tamanho adequado. Rafael segurava a cadeira firme enquanto o pai apertava tudo com cuidado. Levou quase uma hora, mas a cadeira ficou perfeita no final. Rafael se sentiu muito orgulhoso de ter participado daquele trabalho. Seu pai então explicou que aquelas ferramentas já tinham consertado centenas de coisas na família. Prometeu que um dia a caixa seria dele também, para continuar consertando o que quebrasse."],["O Concurso de Pipas","A escola organizou um concurso de pipas para comemorar o início da primavera naquele ano. Cada aluno deveria construir sua própria pipa usando apenas materiais simples e reaproveitados. Bruno pesquisou vários modelos diferentes e escolheu um formato de losango tradicional. Ele usou varetas de bambu, papel de seda colorido e cola caseira feita com farinha. Sua primeira tentativa ficou torta e não subiu nem um metro do chão. Bruno mediu tudo novamente e percebeu que as varetas estavam desequilibradas. Na segunda tentativa, ele foi bem mais cuidadoso com as medidas e os nós. No dia do concurso, ventava bastante no campo atrás da escola. A pipa de Bruno subiu alto e ficou voando firme por muito tempo. Ele não ganhou o primeiro lugar, mas recebeu elogios pelo capricho na construção."]],"9":[["O Mistério da Biblioteca","Júlia adorava passar as tardes na biblioteca da escola, explorando prateleiras cheias de livros antigos e empoeirados. Certa vez, ela notou um livro estranho, escondido atrás de outros volumes, com uma capa desgastada e sem título visível na lombada. Intrigada, ela pediu permissão à bibliotecária para levá-lo para casa naquele fim de semana. Ao abrir as páginas amareladas, Júlia descobriu que se tratava de um diário escrito por uma aluna que havia estudado ali décadas atrás, muito antes dela nascer. As palavras contavam histórias de amizade, desafios na escola e pequenas conquistas do dia a dia daquela época distante. Júlia ficou fascinada em perceber que, mesmo com o tempo passando, os sentimentos das pessoas continuavam bastante parecidos. Ela decidiu mostrar sua descoberta para a professora, que ficou emocionada e propôs uma exposição especial sobre a história da escola. Graças à curiosidade de Júlia, muitos colegas puderam conhecer um pouco mais sobre o passado daquele lugar tão importante para todos eles."],["A Ponte de Palitos","A turma do quarto ano recebeu um desafio interessante da professora de ciências naquele bimestre. Cada grupo deveria construir uma ponte usando somente palitos de sorvete e cola branca comum. A ponte precisava atravessar um vão de quarenta centímetros e sustentar o máximo de peso possível. Camila e seus três colegas começaram desenhando o projeto no papel antes de colar qualquer coisa. Eles pesquisaram formatos de pontes reais e descobriram que triângulos são estruturas muito resistentes. Decidiram então montar a ponte inteira usando triângulos repetidos ao longo das laterais. A montagem levou duas semanas, com muita paciência e várias camadas de cola secando devagar. No dia do teste, cada grupo colocou pesos aos poucos sobre a própria ponte. Algumas desabaram logo no começo, mas a ponte de Camila aguentou quase três quilos. A professora explicou que aquele formato distribuía a força por toda a estrutura. O grupo comemorou bastante, sabendo que o planejamento cuidadoso tinha feito toda a diferença."],["O Relógio do Bisavô","No sótão da casa antiga, Tomás encontrou um relógio de bolso enferrujado dentro de uma lata velha. Sua avó explicou que aquele objeto tinha pertencido ao bisavô dele, um relojoeiro muito respeitado na cidade. O relógio estava completamente parado havia décadas e ninguém sabia se ainda funcionaria algum dia. Tomás decidiu tentar consertar sozinho, mesmo sem entender absolutamente nada sobre engrenagens e mecanismos. Ele assistiu vídeos, leu explicações e desenhou cada peça antes de desmontar qualquer coisa. Com uma pinça emprestada, limpou cuidadosamente a poeira acumulada entre as pequenas rodas dentadas. Depois de muitas tentativas frustradas, percebeu que uma mola estava simplesmente fora do lugar. Quando recolocou a mola corretamente, o relógio voltou a fazer aquele som suave de tique-taque. Sua avó chorou de emoção ao ouvir novamente aquele barulho depois de tantos anos. Tomás guardou o relógio funcionando na estante da sala, como uma lembrança viva da família."],["A Trilha das Formigas","Durante as férias na casa do tio, Beatriz notou uma fila enorme de formigas atravessando o quintal. Curiosa, ela decidiu descobrir de onde elas vinham e para onde estavam indo com tanta pressa. Pegou um caderno e passou a manhã inteira seguindo a trilha, anotando tudo que observava. Descobriu que a fila começava embaixo de uma pedra grande perto do muro dos fundos. O caminho seguia por quase vinte metros até chegar em uma árvore frutífera carregada de goiabas. As formigas carregavam pedacinhos de fruta caída de volta para o formigueiro sem parar. Beatriz percebeu que elas nunca se perdiam, mesmo com tantos desvios pelo caminho. Seu tio explicou que formigas deixam um cheiro no chão para as outras seguirem. Para testar a teoria, Beatriz passou um pano molhado atravessando a trilha delas. As formigas ficaram confusas naquele ponto exato, andando em círculos por alguns minutos. Depois, encontraram o caminho novamente e a fila voltou ao normal. Beatriz anotou tudo e apresentou sua descoberta para a turma."]],"10":[["A Expedição na Floresta","Rafael sempre sonhou em explorar a floresta que ficava atrás da fazenda de seu avô, cheia de árvores altas e sons desconhecidos. Durante as férias, ele finalmente conseguiu permissão para fazer uma pequena expedição, acompanhado por seu cachorro Trovão. Munido de um caderno de anotações e uma lupa, o menino registrava cada planta e inseto diferente que encontrava pelo caminho estreito. Em determinado momento, Rafael avistou pegadas incomuns próximas a um riacho e decidiu segui-las com bastante cautela. Após alguns minutos caminhando devagar, ele se deparou com uma família de capivaras descansando à sombra das árvores mais antigas. Encantado com a cena tranquila, Rafael observou o comportamento dos animais por um longo tempo, anotando tudo com muita atenção. Ao voltar para casa já no fim da tarde, ele mostrou suas descobertas ao avô, que se orgulhou muito da dedicação do neto curioso. Juntos, decidiram criar um pequeno diário de campo para registrar futuras expedições pela propriedade. Rafael aprendeu que a paciência e a observação cuidadosa podem revelar segredos incríveis da natureza, mesmo em lugares que já pareciam familiares desde sempre."],["O Telescópio Caseiro","Gustavo sempre teve fascínio pelo céu noturno, mas nunca tinha conseguido observar nada além de pontos brilhantes. Depois de ler sobre astronomia na biblioteca da escola, decidiu construir seu próprio telescópio caseiro. Pesquisou instruções detalhadas e descobriu que precisaria de duas lentes com distâncias focais diferentes. Encontrou uma lupa antiga na gaveta da avó e comprou outra lente pequena numa papelaria do bairro. Usou tubos de papelão encaixados um dentro do outro para poder ajustar o foco deslizando. A primeira montagem não funcionou porque as lentes estavam posicionadas na distância errada. Gustavo mediu tudo com uma régua e refez os cálculos várias vezes até acertar. Numa noite sem nuvens, apontou o tubo improvisado na direção da lua cheia. Pela primeira vez, conseguiu enxergar as crateras da superfície lunar com detalhes surpreendentes. Ficou tão emocionado que chamou toda a família para olhar pelo telescópio dele. Nas semanas seguintes, observou também as luas de Júpiter aparecendo como pequenos pontos alinhados. Gustavo registrou cada observação num caderno, criando seu próprio diário astronômico caseiro."],["A Feira de Trocas","A escola decidiu organizar uma feira de trocas para incentivar o consumo consciente entre os alunos. A ideia era simples: cada estudante levaria objetos que não usava mais para trocar com os colegas. Helena separou alguns livros já lidos, dois jogos de tabuleiro completos e uma mochila em bom estado. No começo, ela ficou insegura, achando que ninguém teria interesse nas coisas dela. A feira aconteceu no pátio coberto, com mesas organizadas por tipo de objeto. Para surpresa de Helena, seus livros desapareceram rapidamente das mãos dela naquela manhã movimentada. Em troca, ela conseguiu um par de patins quase novo e um kit de pintura. Vários alunos comentaram que estavam levando para casa coisas realmente úteis e desejadas. A professora aproveitou o momento para conversar sobre desperdício e reaproveitamento de materiais. Explicou que muitos objetos são descartados ainda em perfeitas condições de uso. Helena passou a olhar as próprias coisas de forma diferente depois daquele dia. Antes de comprar algo novo, começou a perguntar se realmente precisava daquilo. A feira virou tradição e passou a acontecer duas vezes por ano na escola."],["O Mapa do Bairro","O professor de geografia propôs um trabalho diferente para a turma do quinto ano naquele semestre. Cada aluno deveria desenhar um mapa detalhado do próprio bairro, marcando pontos importantes do cotidiano. Vitor achou a tarefa simples no início, mas percebeu logo que seria bem mais complicada. Ao caminhar pelas ruas com um caderno, notou detalhes que nunca tinha reparado antes. Descobriu duas praças pequenas, uma padaria escondida numa esquina e três pontos de ônibus diferentes. Também percebeu que algumas ruas mudavam de nome no meio do trajeto sem aviso nenhum. Vitor mediu distâncias contando passos e anotou tudo com bastante cuidado no caderno. Em casa, transformou aquelas anotações confusas num desenho organizado usando papel quadriculado. Criou legendas coloridas para cada tipo de lugar: comércio, moradia, área verde e serviço público. O mapa final ficou muito mais completo do que ele tinha imaginado no começo. Durante a apresentação, seus colegas reconheceram lugares que frequentavam sem saber os nomes corretos. O professor comentou que mapas ajudam a enxergar o espaço de forma organizada. Vitor pendurou o trabalho no quarto e passou a usar como referência."]],"11":[["O Experimento Inesperado","Para a feira de ciências da escola, Camila decidiu investigar como diferentes tipos de solo afetavam o crescimento das plantas de feijão. Ela plantou sementes em quatro vasos distintos, cada um preenchido com um tipo de terra diferente, e passou semanas observando e anotando os resultados com disciplina. No início, os dados pareciam bastante confusos: algumas plantas cresciam rapidamente, enquanto outras mal brotavam da terra escura. Frustrada com a falta de padrão, Camila quase desistiu do projeto, mas sua professora a incentivou a revisar cada etapa do experimento com calma. Ao reexaminar suas anotações antigas, a menina percebeu que havia esquecido de considerar a quantidade de luz solar que cada vaso recebia, já que estavam posicionados em locais diferentes da varanda. Corrigindo essa variável importante, ela repetiu o experimento inteiro e, dessa vez, os resultados fizeram muito mais sentido do que antes. Na apresentação final, Camila explicou não apenas suas descobertas sobre solo e crescimento, mas também a importância de identificar erros metodológicos durante uma pesquisa científica séria. Os professores elogiaram sua honestidade ao compartilhar os desafios enfrentados, não somente os sucessos alcançados. Camila entendeu que a ciência é feita de tentativas, ajustes e aprendizado constante, e que errar faz parte natural do processo de descobrir algo novo."],["A Rádio da Escola","Um grupo de alunos do sexto ano propôs criar uma rádio para tocar durante o intervalo. A direção aprovou a ideia, mas exigiu que o projeto inteiro fosse organizado pelos próprios estudantes. Larissa assumiu a coordenação e logo percebeu que a tarefa era muito maior do que parecia. Era necessário montar uma grade de programação, dividir funções e conseguir equipamentos emprestados. Nas primeiras reuniões, o grupo discordava constantemente sobre quais músicas deveriam ser tocadas. Alguns queriam apenas sucessos populares, enquanto outros defendiam estilos mais variados e menos conhecidos. Larissa sugeriu uma solução intermediária: cada dia da semana teria um estilo diferente. A proposta agradou quase todo mundo e o impasse finalmente foi resolvido. Depois vieram os problemas técnicos, com microfones falhando e caixas de som chiando bastante. Um professor de física ajudou a turma a entender questões básicas de cabos e conexões. Na estreia, o pátio inteiro parou para ouvir os colegas apresentando ao vivo. Nem tudo saiu perfeito: houve silêncios constrangedores e uma música cortada pela metade. Ainda assim, a recepção foi calorosa e a rádio virou parte da rotina escolar. Larissa aprendeu que liderar significa principalmente escutar e encontrar acordos entre pessoas diferentes."],["O Caderno de Receitas","Quando sua bisavó faleceu, Manuela herdou um caderno de receitas escrito à mão ao longo de sessenta anos. As páginas estavam manchadas de gordura e algumas anotações mal podiam ser lidas por causa do tempo. Manuela decidiu preservar aquele material antes que se perdesse completamente com o passar dos anos. Começou digitando cada receita no computador, tentando decifrar a letra difícil e as abreviações antigas. Encontrou medidas estranhas como \"uma xícara das de chá\" e \"manteiga do tamanho de um ovo\". Precisou pesquisar bastante para converter aquelas quantidades em medidas modernas e padronizadas. Algumas receitas tinham observações pessoais nas margens, escritas em momentos diferentes da vida. Uma delas dizia apenas: \"fiz no casamento da Rita, todo mundo pediu de novo\". Manuela percebeu que estava organizando muito mais do que instruções culinárias simples. Aquelas páginas guardavam a memória de festas, encontros e gerações inteiras da família. Ela decidiu testar cada receita antes de incluir na versão digital definitiva. Algumas deram certo de primeira, outras exigiram três ou quatro tentativas frustradas. No final, imprimiu vários exemplares e distribuiu entre tias, primos e sobrinhos espalhados. O presente emocionou toda a família e virou motivo de encontros mais frequentes."],["A Corrida de Carrinhos","A feira de tecnologia do colégio incluiu uma competição de carrinhos movidos exclusivamente por energia solar. Cada equipe recebeu um kit básico com painel, motor pequeno, rodas e uma placa de madeira. O restante do projeto ficava por conta da criatividade e do conhecimento de cada grupo participante. Otávio e seus colegas passaram semanas testando formatos diferentes de carroceria no pátio da escola. Descobriram que peso e atrito influenciavam muito mais o desempenho do que imaginavam inicialmente. O primeiro protótipo era pesado demais e mal conseguia se mover em dias nublados. A equipe substituiu a madeira por papelão reforçado, reduzindo drasticamente o peso total. Também perceberam que o ângulo do painel solar afetava bastante a captação de luz. Fizeram medições em diferentes horários, anotando velocidade e condições do céu naquele momento. Com os dados organizados numa tabela, ajustaram a inclinação para o melhor rendimento possível. No dia da corrida, o tempo estava parcialmente nublado, o que preocupou todas as equipes. O carrinho de Otávio largou devagar, mas manteve velocidade constante durante todo o percurso. Terminou em segundo lugar, atrás apenas de um grupo com solução parecida. Os jurados elogiaram especialmente a documentação detalhada dos testes realizados pela equipe."]],"12":[["A Carta Perdida no Tempo","Enquanto ajudava a organizar o sótão da casa de sua bisavó, Théo encontrou uma caixa de madeira entalhada, escondida atrás de móveis antigos cobertos de poeira acumulada. Dentro dela, havia cartas amareladas, escritas décadas atrás, e um mapa desenhado à mão que parecia indicar um lugar específico na propriedade da família. Curioso e um tanto cético, Théo decidiu ler as cartas com atenção, tentando entender a história por trás daquelas palavras cuidadosamente escritas havia tanto tempo. Ele descobriu que pertenciam a um tio-bisavô que havia se mudado para outro país durante um período difícil, e que nunca teve a chance de retornar para buscar aquilo que havia escondido antes de partir para sempre. Movido pela curiosidade e por um crescente senso de conexão com aquela história familiar, Théo pediu ajuda ao pai para decifrar o mapa desenhado à mão com tanto cuidado. Juntos, eles caminharam pelo quintal antigo, comparando pontos de referência que, surpreendentemente, ainda existiam depois de tantos anos de mudanças. Após alguma escavação cuidadosa perto de uma velha árvore, encontraram uma pequena caixa de metal enferrujada, contendo fotografias antigas e um bilhete final, nunca enviado a ninguém. Théo percebeu que aquela descoberta não tratava de tesouro material algum, mas de um vínculo emocional entre gerações que o tempo não havia conseguido apagar completamente com os anos. Ele guardou tudo com muito cuidado, prometendo a si mesmo que um dia contaria essa história para seus próprios filhos, mantendo viva a memória de uma família que soube preservar pedaços importantes de sua trajetória."],["O Documentário da Turma","A professora de história propôs um trabalho ambicioso para encerrar o ano letivo do nono ano. Os alunos deveriam produzir um documentário curto sobre a história do próprio bairro onde estudavam. A turma se dividiu em equipes responsáveis por pesquisa, entrevistas, gravação e edição do material final. Isabela ficou encarregada das entrevistas com moradores antigos, tarefa que parecia simples no papel. Na prática, descobriu que conversar com desconhecidos exigia preparação e sensibilidade muito maiores. As primeiras tentativas foram desastrosas: perguntas fechadas geravam respostas curtas e pouco interessantes. Uma senhora respondeu apenas \"sim\" e \"não\" durante quinze minutos inteiros de gravação. Isabela reformulou completamente seu roteiro, trocando perguntas diretas por convites à narrativa pessoal. Em vez de perguntar quando alguém chegou ao bairro, passou a pedir que descrevessem a primeira lembrança do lugar. A mudança transformou completamente a qualidade das conversas registradas nas semanas seguintes. Um senhor de oitenta anos falou por quase uma hora sobre uma antiga estação ferroviária desativada. Contou detalhes que nenhum documento oficial da prefeitura havia registrado ao longo das décadas. A equipe de pesquisa confirmou parte das informações consultando jornais antigos digitalizados. O documentário final durou apenas doze minutos, mas reuniu depoimentos de onze moradores diferentes. Na exibição para as famílias, várias pessoas se emocionaram reconhecendo histórias que julgavam esquecidas."],["A Estufa Abandonada","Nos fundos do terreno da escola existia uma estufa de vidro abandonada havia mais de dez anos. As plantas tinham morrido, os vidros estavam quebrados e o mato tomava conta de todo o espaço interno. Um grupo de estudantes propôs recuperar aquele lugar como projeto voluntário de ciências ambientais. A direção autorizou, desde que os alunos apresentassem um plano detalhado e realista de recuperação. Nicolas liderou o levantamento inicial, catalogando tudo que precisaria ser consertado ou substituído. A lista ficou assustadoramente longa e o orçamento estimado ultrapassava qualquer valor disponível na escola. Em vez de desistir, o grupo decidiu dividir o projeto em etapas menores e independentes. A primeira fase envolveu apenas limpeza e remoção de entulho, sem custo algum além de trabalho. Nos sábados seguintes, dezenas de voluntários apareceram para ajudar na retirada do mato acumulado. A segunda fase exigia vidros novos, conseguidos através de doação de uma vidraçaria do bairro. O dono aceitou colaborar em troca de uma placa reconhecendo a contribuição da empresa. Para a terceira fase, os alunos organizaram uma rifa e uma venda de mudas cultivadas. Arrecadaram o suficiente para comprar terra adubada, sementes e um sistema simples de irrigação. Oito meses depois do início, a estufa funcionava novamente e abrigava setenta espécies diferentes. O espaço passou a receber aulas práticas de botânica para todas as séries do colégio. Nicolas percebeu que projetos grandes se tornam possíveis quando divididos em partes administráveis."],["O Concurso de Robótica","A equipe de robótica do colégio classificou-se pela primeira vez para uma competição estadual naquele ano. O desafio consistia em programar um robô autônomo capaz de identificar e separar objetos por cor. Nenhum integrante da equipe tinha experiência anterior com sensores ópticos ou algoritmos de classificação. Eduardo assumiu a programação, enquanto outros colegas cuidaram da estrutura mecânica e da montagem elétrica. Os primeiros testes foram completamente frustrantes: o robô confundia vermelho com laranja constantemente. Eduardo passou noites estudando como sensores interpretam luz refletida em superfícies diferentes. Descobriu que a iluminação do ambiente alterava significativamente as leituras registradas pelo equipamento. A solução encontrada foi calibrar o sensor no início de cada rodada, criando uma referência local. Essa mudança reduziu drasticamente os erros de identificação durante os testes seguintes em laboratório. Faltando duas semanas para a competição, um motor queimou durante um treino intenso. A equipe não tinha peça reserva nem tempo suficiente para encomendar outra unidade idêntica. Um aluno do terceiro ano sugeriu adaptar um motor retirado de uma impressora velha descartada. A adaptação exigiu redesenhar o encaixe inteiro e reescrever parte do código de movimentação. Contra todas as expectativas, funcionou razoavelmente bem nos ajustes finais antes da viagem. Na competição, a equipe ficou em quinto lugar entre trinta e dois grupos participantes. Mais do que a classificação, levaram para casa a certeza de que sabiam resolver problemas inesperados."]]};

      /* mesma regra da nuvem: "Renata" + 🦋 → renata_1f98b (sem acento, sem maiúscula) */

        const e = Array.from(av || "").map((c) => c.codePointAt(0).toString(16)).filter((h) => h !== "fe0f" && h !== "200d").join("-") || "x";
        return n + "_" + e;

      /* ===================== som ===================== */
      let ctx = null;
      function bip(freq, dur, tipo) {
        try {
          if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = tipo || "sine";
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.14, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
          o.connect(g);
          g.connect(ctx.destination);
          o.start();
          o.stop(ctx.currentTime + dur);
        } catch (e) {}
      }
      /* um único som neutro pra QUALQUER marcação (acertou/errou/
         silabou) — o objetivo é só avisar "mudou de palavra",
         sem som de "errado" que desanime a criança durante a leitura */
      const somPassagem = () => bip(660, 0.07, "sine");
      function somFim() {
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => bip(f, 0.22), i * 130));
      }
      const somContagem = () => bip(440, 0.1, "sine");
      const somContagemVai = () => bip(880, 0.16, "sine");

        } catch (e) {}
      }
      function alternarTelaCheia() {
        if (estaTelaCheia()) {
          try {
            (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
          } catch (e) {}
        } else {
          entrarTelaCheia();
        }
        setTimeout(atualizarIconeTelaCheia, 250);
      }

      function serieDaIdade(idade) {

      /* série do perfil: usa o ano escolar escolhido no cadastro; para

      function serieDoPerfil(p) {
        if (!p) return SERIES[1];

          ? p.serie
          : (SERIE_SUGERIDA_IDADE[p.idade] !== undefined ? SERIE_SUGERIDA_IDADE[p.idade] : 1);
        return SERIES[id] || SERIES[1];

      function metaListaPerfil(p) { return serieDoPerfil(p).lista; }

      function equivalencia(ppmc) {
        let achado = null;
        SERIES.forEach((s) => { if (s.lista && ppmc >= s.lista * 0.85) achado = s; });
        if (achado) return achado.nome;
        if (ppmc >= 11) return "início do 1º ano";
        return "ainda antes do 1º ano";
      }

      function faixaMeta(ppmc, meta) {
        if (!meta) return null;
        const r = ppmc / meta;
        if (r < 0.5) return { rot: "Insuficiente", cls: "t-ins" };
        if (r < 0.85) return { rot: "Em desenvolvimento", cls: "t-dev" };
        if (r < 1.15) return { rot: "Adequado", cls: "t-adq" };
        return { rot: "Avançado", cls: "t-ava" };
      }
      function faixa(ppmc, idade) { return faixaMeta(ppmc, metaLista(idade)); }

      /* ===================== classificação oficial CAEd/UFJF =====================
         Pré-leitor / Leitor Iniciante / Leitor Fluente — os limiares abaixo
         vêm direto do material de treinamento do CAEd sobre a Avaliação de
         Fluência Leitora (a mesma prova usada em SP e outros estados):
           - PRÉ-LEITOR: lê em média até 10 palavras de uma lista (até 5
             pseudopalavras), independente da precisão.
           - INICIANTE: lê mais de 11 palavras (mais de 5 pseudopalavras),
             qualquer padrão silábico, mas com precisão ABAIXO de 90%.
           - FLUENTE: no texto corrido, precisão ACIMA de 90% (mais de 65
             corretas num texto de ~150-180 palavras), reconhece pausas de
             sentido (prosódia) e responde bem as perguntas de compreensão.
         Isso é uma classificação DIFERENTE da faixa por meta de PPM da
         idade (acima) — uma é uma referência de velocidade por idade
         (PNA/Oliveira&Castro), a outra é o critério qualitativo que o
         próprio instrumento oficial usa. Mostramos as duas. */
      function perfilCAEd(modo, corretas, precisao) {
        if (modo === "pseudo") {
          if (corretas <= 5) return { rot: "Pré-leitor", cls: "t-ins" };
          if (precisao < 90) return { rot: "Leitor Iniciante", cls: "t-dev" };
          return { rot: "Leitor Fluente", cls: "t-ava" };
        }
        if (modo === "frases") {
          if (corretas < 20) return { rot: "Pré-leitor", cls: "t-ins" };
          if (precisao < 90) return { rot: "Leitor Iniciante", cls: "t-dev" };
          return { rot: "Leitor Fluente", cls: "t-ava" };
        }
        // palavras
        if (corretas <= 10) return { rot: "Pré-leitor", cls: "t-ins" };
        if (precisao < 90) return { rot: "Leitor Iniciante", cls: "t-dev" };
        return { rot: "Leitor Fluente", cls: "t-ava" };
      }

      /* nível que será usado no próximo teste.

         - modo AUTOMÁTICO: o nível já ajustado pelo histórico; se ainda
           não houver histórico, o sugerido pelo ano escolar */
      function nivelInicialPerfil(p) {
        if (p.nivelModo === "manual" && p.nivelManual) return p.nivelManual;
        if (p.nivelAtual) return p.nivelAtual;
        return serieDoPerfil(p).nivel || NIVEL_INICIAL_IDADE[p.idade] || 2;
      }

                 <p class="aviso">Se ela ficar ${config.tempoLimitePalavra}s sem tocar em Ainda não, Silabou ou OK, a próxima palavra aparece sozinha, marcada como "Ainda não". Isso evita que uma palavra travada consuma o minuto inteiro sozinha.</p>`
              : `<p class="aviso">A palavra só muda quando você tocar em um dos 4 botões.</p>`
          }

          <div class="config-titulo">📺 Tela</div>
          <div class="config-toggle-linha">
            <span>🔆 Não deixar a tela apagar</span>
            <button class="toggle-pill" id="btn-tela-acesa" onclick="alternarTelaAcesaUI()">…</button>
          </div>
          <p class="aviso" id="tela-acesa-aviso">…</p>

          <div class="config-titulo">☁️ Nuvem</div>
          <p class="aviso" id="cfgNuvemSt">Preparando...</p>
          <p class="aviso">Código da família: <b id="cfgNuvemFam">—</b></p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
            <button class="btn btn-contorno" style="flex:1;min-width:150px;padding:12px" onclick="popupCodigoFamilia(false)">🔑 Código da família</button>
            <button class="btn btn-contorno" style="flex:1;min-width:150px;padding:12px" onclick="nuvemSincronizarAgora()">🔄 Sincronizar agora</button>
          </div>
          <button class="btn btn-contorno" style="width:100%;margin-top:8px;padding:12px" onclick="mostrarVersoesGuardadas()">🕘 Versões guardadas</button>

          <button class="btn btn-ouro" style="width:100%;margin-top:18px;padding:16px;font-size:1.05rem" onclick="fecharConfig()">Fechar</button>`;
      }

      /* botões +/− ao lado das barras deslizantes — some dá um passo de
         1 de cada vez, deixando óbvio que o valor mudou (a barra sozinha
         é mais difícil de perceber a mudança num toque rápido) */
      function passoConfig(campo, delta, min, max) {
        const novo = Math.max(min, Math.min(max, (config[campo] || 0) + delta));
        if (novo === config[campo]) return;
        mudarConfig(campo, novo);
      }

      function atualizarPreviewFonte() {
        const f = FONTES[config.fonte] || FONTES.redonda;
        const p = document.getElementById("preview-fonte-palavra");
        if (!p) return;
        p.style.fontFamily = f.css;
        const caixaEfetiva = f.cursiva ? "capitalizada" : config.caixa;
        p.style.textTransform = CAIXAS[caixaEfetiva] || "capitalize";
        p.style.fontSize = `calc(clamp(2.4rem, 10.5vw, 5.8rem) * ${(config.tamanho / 18).toFixed(3)})`;
      }

      function mudarConfig(campo, valor) {
        config[campo] = valor;
        aplicarConfig();
        gravarConfig();
        if (document.getElementById("modal-config").style.display === "flex") {
          if (campo === "tamanho") {
            const tit = document.getElementById("titulo-tamanho");
            if (tit) tit.textContent = `Tamanho da palavra (${config.tamanho}px)`;
            const r = document.getElementById("range-tamanho");
            if (r) {
              r.value = config.tamanho;
              const [menos, mais] = r.parentElement.querySelectorAll(".btn-passo");
              if (menos) menos.disabled = config.tamanho <= 14;
              if (mais) mais.disabled = config.tamanho >= 24;
            }
            atualizarPreviewFonte();
          } else if (campo === "tempoLimitePalavra") {
            const tit = document.getElementById("titulo-tempo-pular");
            if (tit) tit.textContent = `Tempo sem tocar em nada (${config.tempoLimitePalavra}s)`;
            const r = document.getElementById("range-tempo-pular");
            if (r) {
              r.value = config.tempoLimitePalavra;
              const [menos, mais] = r.parentElement.querySelectorAll(".btn-passo");
              if (menos) menos.disabled = config.tempoLimitePalavra <= 3;
              if (mais) mais.disabled = config.tempoLimitePalavra >= 10;
            }
            const aviso = document.querySelector("#config-conteudo .aviso");
            if (aviso) aviso.textContent = `Se ela ficar ${config.tempoLimitePalavra}s sem tocar em Ainda não, Silabou ou OK, a próxima palavra aparece sozinha, marcada como "Ainda não". Isso evita que uma palavra travada consuma o minuto inteiro sozinha.`;
          } else {
            document.getElementById("config-conteudo").innerHTML = construirConfigHTML();
            atualizarPreviewFonte();
          }
        }
      }

      function alternarToggle(campo) {
        config[campo] = !config[campo];
        gravarConfig();
        document.getElementById("config-conteudo").innerHTML = construirConfigHTML();
        atualizarPreviewFonte();
      }

      /* ===================== telas ===================== */
      const raiz = () => document.getElementById("raiz");

      function pegarSerie(b) {

      function pegarIdade(b) {
        if (!b) return;
        document.querySelectorAll(".idade-op").forEach((x) => x.classList.remove("sel"));
        b.classList.add("sel");
        escolhaIdade = parseInt(b.dataset.i, 10);
        // sugere o ano escolar típico dessa idade — continua podendo trocar
        const sugerida = SERIE_SUGERIDA_IDADE[escolhaIdade];

      function criarPerfil() {
        const el = document.getElementById("nome-novo");
        const nome = (el.value || "").trim().replace(/[<>"'`]/g, "");
        if (!nome) {
          el.style.borderColor = "#ef4444";
          el.placeholder = "Escreva o nome aqui!";
          return;
        }
        let base = nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "") || "leitor";
        const perfis = lerPerfis();
        let id = base, n = 2;
        while (perfis.some((p) => p.id === id)) id = base + n++;
        perfis.push({ id, nome, idade: escolhaIdade, serie: escolhaSerie, emoji: escolhaEmoji,
                      nivelModo: "auto", nivelManual: null, criado: Date.now() });
        gravarPerfis(perfis);
        selecionarPerfil(id);
        // se já existir progresso na nuvem pra esse nome+bichinho (outro
        // celular da família), traz sozinho — sem apagar nada daqui
        try { if (typeof nuvemTentarRecuperarNovo === "function") nuvemTentarRecuperarNovo(id, nome, escolhaEmoji); } catch (e) {}
      }

      function selecionarPerfil(id) {

        config = lerConfig();
        aplicarConfig();
        mostrarMenu();
        // ao abrir o leitor, busca sozinho o que outro celular da família
        // já tiver mandado pra nuvem (nunca apaga o que está aqui)
        try { if (typeof nuvemLevarFichaAntiga === "function") nuvemLevarFichaAntiga(perfilAtivo.id, perfilAtivo.nome, perfilAtivo.emoji); } catch (e) {}
      }

      function mostrarMenu() {
        botaoTelaCheiaVisivel(true);
        const p = perfilAtivo;
        const hist = lerTestes(p.id);
        const ultimo = hist.length ? hist[hist.length - 1] : null;
        raiz().innerHTML = `
          <div style="font-size:2.2rem">${p.emoji}</div>
          <h1 style="color:var(--texto);margin:2px 0 0">Oi, ${esc(p.nome)}!</h1>
          <p class="sub" style="margin-bottom:4px">${p.idade} anos · ${nomeSerie(p)}</p>

          <div class="grade-modos">
            <button class="btn btn-verde" onclick="abrirPreparo('palavras')">
              <span class="modo-ico">📖</span>
              <span class="modo-titulo">Leitura de Palavras</span>
              <span class="modo-sub">1 minuto · o adulto marca os acertos</span>
            </button>
            <button class="btn btn-roxo" onclick="abrirPreparo('pseudo')">
              <span class="modo-ico">🔤</span>
              <span class="modo-titulo">Leitura de Pseudopalavras</span>
              <span class="modo-sub">testa a decodificação pura, sem memorização</span>
            </button>
            <button class="btn btn-azul" onclick="abrirPreparoFrases()">
              <span class="modo-ico">💬</span>
              <span class="modo-titulo">Leitura de Frases</span>
              <span class="modo-sub">texto corrido · toque nas palavras erradas</span>
            </button>
          </div>

          <div class="linha-inferior-menu">
            ${
              ultimo
                ? `<div class="painel" style="margin:0;flex:1">
                    <div class="linha"><span>Último teste</span><span class="v">${ultimo.ppmc} palavras/min</span></div>
                    <div class="linha"><span>Nível atual</span><span class="v">N${p.nivelAtual || NIVEL_INICIAL_IDADE[p.idade] || 2}</span></div>
                   </div>`
                : `<p class="aviso" style="text-align:center;flex:1;margin:0">Nenhum teste ainda. O primeiro serve de ponto de partida.</p>`
            }
            <button class="btn btn-contorno" style="flex:0 0 auto;padding:12px 22px;font-size:0.95rem" onclick="mostrarRelatorio()">
              📄 <span style="font-size:0.85rem">Relatório</span>
            </button>
            <button class="btn btn-contorno" style="flex:0 0 auto;padding:12px 22px;font-size:0.95rem" onclick="mostrarAjustesLeitor()">
              👤 <span style="font-size:0.85rem">Perfil</span>
            </button>
          </div>
