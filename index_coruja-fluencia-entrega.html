        if (!todos.length) {
          doc.linha("Nenhum teste registrado ainda.", { tamanho: 11, cor: CORES_PDF.fraco });
        }

        doc.linha(`Historico de testes (${todos.length})`, { tamanho: 13, negrito: true, cor: CORES_PDF.titulo, espacoDepois: 14 });

        const secaoPalavras = (titulo, lista, cor) => {
          doc.linha(`${titulo} (${lista.length})`, { tamanho: 10, negrito: true, cor, espacoDepois: 3 });
          doc.paragrafo(lista.length ? lista.join(", ") : "Nenhuma.", { tamanho: 9, cor: CORES_PDF.texto });
          doc.espaco(6);
        };

        for (const t of todos) {
          const data = new Date(t.data).toLocaleString("pt-BR");
          doc.cartaoInicio();

          if (t.tipoTeste === "palavras") {
            const caed = perfilCAEd("palavras", t.corretas, t.precisao);
            const meta = t.meta || metaListaPerfil(p);
            const faixaTeste = faixaMeta(t.ppmc, meta);
            doc.linha(`Leitura de Palavras  -  N${t.nivel}  -  ${t.serieNome || nomeSerie(p)}`, { tamanho: 12, negrito: true, cor: CORES_PDF.titulo, espacoDepois: 2 });
            doc.linha(data, { tamanho: 9, cor: CORES_PDF.fraco, espacoDepois: 8 });
            doc.linha(`${t.ppmc} palavras corretas por minuto  -  precisao ${t.precisao}%  -  ${t.total} tentadas`, { tamanho: 10.5, cor: CORES_PDF.texto, espacoDepois: 8 });
            doc.badges([
              faixaTeste ? [faixaTeste.rot, CORES_PDF.azulFundo, CORES_PDF.azul] : ["Sem meta nesta serie", CORES_PDF.cinzaFundo, CORES_PDF.cinza],
              ["CAEd: " + caed.rot, CORES_PDF.roxoFundo, CORES_PDF.roxo],
            ]);
            doc.linha(`Nivel de dificuldade: N${t.nivel} (${NIVEL_DESC[t.nivel] || ""})`, { tamanho: 9.5, cor: CORES_PDF.texto, espacoDepois: 3 });
            const ajusteInfo = ROTULO_AJUSTE[t.ajusteDirecao] || ROTULO_AJUSTE["sem-meta"];
            doc.linha(`Proximo teste: ${ajusteInfo.txt}${t.ajusteTeto ? " (teto do modo automatico)" : ""}`, { tamanho: 9.5, cor: CORES_PDF.texto, espacoDepois: 3 });
            const metaProxima = metaProximoNivel(t, p);
            if (metaProxima) {
              doc.linha(
                metaProxima.jaBateu
                  ? `Meta pra subir de nivel: ja bateu (${metaProxima.alvoPpmc} ppmc)`
                  : `Meta pra subir de nivel: ${metaProxima.alvoPpmc} ppmc (faltam ${metaProxima.faltam})`,
                { tamanho: 9.5, cor: CORES_PDF.laranja, espacoDepois: 3 }
              );
            }
            doc.linha(`Exibido em: fonte ${t.fonteNome || "-"}, ${t.tamanhoFonte || "-"}px, ${t.caixaNome || "-"}`, { tamanho: 9.5, cor: CORES_PDF.texto, espacoDepois: 8 });
            const dificuldades = analisarDificuldades(t);
            if (dificuldades.length) {
              doc.linha("Onde focar o treino:", { tamanho: 9.5, negrito: true, cor: CORES_PDF.texto, espacoDepois: 2 });
              doc.paragrafo(
                dificuldades.map(({ tag, n }) => `${tag} (${n})`).join("  -  "),
                { tamanho: 9, cor: CORES_PDF.texto }
              );
              doc.espaco(6);
            } else {
              doc.espaco(2);
            }

            secaoPalavras("OK", t.palavrasAcertadas || [], CORES_PDF.verde);
            secaoPalavras("Silabou", t.palavrasSilabadas || [], CORES_PDF.laranja);
            if ((t.palavrasPuladas || []).length) secaoPalavras("Pulou (registro antigo)", t.palavrasPuladas, CORES_PDF.cinza);
            secaoPalavras("Ainda não", t.palavrasErradas || [], CORES_PDF.vermelho);
          } else if (t.tipoTeste === "pseudo") {
            const caed = perfilCAEd("pseudo", t.corretas, t.precisao);
            doc.linha(`Leitura de Pseudopalavras  -  N${t.nivel}`, { tamanho: 12, negrito: true, cor: CORES_PDF.titulo, espacoDepois: 2 });
            doc.linha(data, { tamanho: 9, cor: CORES_PDF.fraco, espacoDepois: 8 });
            doc.linha(`${t.precisao}% de precisao na decodificacao  -  ${t.total} tentadas`, { tamanho: 10.5, cor: CORES_PDF.texto, espacoDepois: 8 });
            doc.badges([["CAEd: " + caed.rot, CORES_PDF.roxoFundo, CORES_PDF.roxo]]);
            doc.linha(`OK ${t.acertou}  -  Silabou ${t.silabou}  -  Ainda não ${t.errou}`, { tamanho: 9.5, cor: CORES_PDF.texto, espacoDepois: 4 });
            doc.paragrafo("Palavras inventadas, sem vocabulario real - mede decodificacao pura, sem apoio de memorizacao visual.", { tamanho: 8.5, cor: CORES_PDF.fraco });
            doc.espaco(2);
            secaoPalavras("OK", t.palavrasAcertadas || [], CORES_PDF.verde);
            secaoPalavras("Silabou", t.palavrasSilabadas || [], CORES_PDF.laranja);
            if ((t.palavrasPuladas || []).length) secaoPalavras("Pulou (registro antigo)", t.palavrasPuladas, CORES_PDF.cinza);
            secaoPalavras("Ainda não", t.palavrasErradas || [], CORES_PDF.vermelho);
          } else {
            const caed = perfilCAEd("frases", t.corretas, t.precisao);
            doc.linha(`Leitura de Frases  -  "${t.titulo || ""}"`, { tamanho: 12, negrito: true, cor: CORES_PDF.titulo, espacoDepois: 2 });
            doc.linha(data, { tamanho: 9, cor: CORES_PDF.fraco, espacoDepois: 8 });
            doc.linha(`${t.ppmc} ppmc${t.terminouAntes ? " (estimado)" : ""}  -  ${t.tentadas} tentadas  -  ${t.erros} erros  -  precisao ${t.precisao}%`, { tamanho: 10.5, cor: CORES_PDF.texto, espacoDepois: 8 });
            doc.badges([["CAEd: " + caed.rot, CORES_PDF.roxoFundo, CORES_PDF.roxo]]);
            secaoPalavras("Palavras erradas", t.palavrasErradas || [], CORES_PDF.vermelho);
          }
          doc.cartaoFim();
        }

        doc.espaco(6);
        doc.linhaH(doc.MARGEM, doc.PAGE_W - doc.MARGEM, doc.y, CORES_PDF.cinzaFundo, 1);
        doc.espaco(14);
        doc.linha("Sobre os criterios", { tamanho: 11, negrito: true, cor: CORES_PDF.titulo, espacoDepois: 8 });
        doc.paragrafo(
          "A classificacao CAEd usa os criterios da Avaliacao de Fluencia Leitora do Centro de Politicas Publicas e Avaliacao da Educacao (CAEd/UFJF): Pre-leitor le ate 10 palavras por minuto (ou 5 pseudopalavras); Leitor Iniciante le mais que isso mas com precisao abaixo de 90%; Leitor Fluente mantem precisao acima de 90%.",
          { tamanho: 8.5, cor: CORES_PDF.fraco },
        );
        doc.espaco(6);
        doc.paragrafo(
          "As metas de palavras por minuto por serie sao uma estimativa de trabalho (80% da meta de texto corrido, base PNA / Oliveira & Castro, 2010), nao uma norma oficial. Um teste de 1 minuto e acompanhamento, nao diagnostico.",
          { tamanho: 8.5, cor: CORES_PDF.fraco },
        );

        const nomeArquivo = `coruja-fluencia-${(p.nome || "leitor").toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${new Date().toISOString().slice(0, 10)}.pdf`;
        doc.baixar(nomeArquivo);
      }

      function copiarRelatorio() {
        const p = perfilAtivo;
        const hist = lerTestes(p.id);
        const t = hist[hist.length - 1];
        const f = faixaMeta(t.ppmc, t.meta || metaListaPerfil(p));
        const ajuste = rotuloAjuste(t);
        const txt = [
          `Coruja 🦉 — Fluência — leitura de palavras`,
          `${p.nome}, ${t.idade} anos (${t.serieNome || nomeSerie(p)})`,
          `${new Date(t.data).toLocaleString("pt-BR")}`,
          ``,
          `Palavras corretas por minuto: ${t.ppmc}`,
          `Tentadas: ${t.total} | OK: ${t.acertou} | Silabou: ${t.silabou} | Ainda não: ${t.errou}`,
          `Classificação: ${f ? f.rot : "sem meta oficial nesta idade"}`,
          `Nível de dificuldade: N${t.nivel} (${NIVEL_DESC[t.nivel]})`,
          `Fonte usada: ${t.fonteNome || "—"}, ${t.tamanhoFonte || "—"}px, ${t.caixaNome || "—"}`,
          `Nível equivalente: ${equivalencia(t.ppmc)}`,
          `Ajuste para o próximo teste: ${ajuste.txt}`,
          ``,
          `Palavras OK: ${(t.palavrasAcertadas || []).join(", ") || "nenhuma"}`,
          `Palavras para praticar: ${t.palavrasErradas.join(", ") || "nenhuma"}`,
          `Palavras silabadas: ${t.palavrasSilabadas.join(", ") || "nenhuma"}`,
          ...(t.pulou ? [`Palavras puladas (registro antigo): ${t.palavrasPuladas.join(", ")}`] : []),
        ].join("\n");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(
            () => popupAviso("Copiado!", "O resumo foi copiado para a área de transferência."),
            () => popupCopiarTexto("Copiar resumo", txt),
          );
        } else {
          popupCopiarTexto("Copiar resumo", txt);
        }
      }

      /* ===================================================================
         ☁️ NUVEM (Firebase) — ligação deste app com o nuvem-sync.js
         O celular continua sendo o dono dos dados. A nuvem é uma cópia de
         segurança que se atualiza sozinha quando há internet. Segue o
         mesmo padrão do Curiosidades/Alfabetização, adaptado ao jeito do
         Fluência guardar dados (um perfil com idade/série/nível + 4
         históricos de teste separados por leitor).
         =================================================================== */
      const APP_NUVEM = "fluencia";

      function nuvemIdDaChave(k) {
        const m = /^corujaFluencia(?:Testes|PseudoTestes|FrasesTestes|TextosUsados)_(.+)$/.exec(k || "");
        if (!m) return null;
        const id = m[1];
        return lerPerfis().some((p) => p.id === id) ? id : null;
      }

      function nuvemExportar(id) {
        const p = lerPerfis().find((x) => x.id === id);
        if (!p) return {};
        return {
          idade: p.idade, serie: p.serie, nivelModo: p.nivelModo, nivelManual: p.nivelManual, nivelAtual: p.nivelAtual,
          testes: JSON.stringify(lerTestes(id)),
          pseudoTestes: JSON.stringify(lerTestesPseudo(id)),
          frasesTestes: JSON.stringify(lerTestesFrases(id)),
          textosUsados: JSON.stringify(lerTextosUsados(id)),
        };
      }

      /* mistura o que veio da nuvem com o que já existe neste celular.
         Regra de ouro: NUNCA perder um teste já feito. */
      function nuvemMesclar(id, dn, restaurando) {
        const Jp = (t, d) => {
          try { const v = typeof t === "string" ? JSON.parse(t) : t; return v === null || v === undefined ? d : v; }
          catch (e) { return d; }
        };
        // históricos de teste: junta os dois lados, sem duplicar (mesma
        // data em milissegundos = mesmo teste), mantendo tudo
        const juntaHist = (localArr, remArr) => {
          const vistos = {}, fim = [];
          (localArr || []).concat(remArr || []).forEach((t) => {
            if (!t || !t.data) return;
            const k = String(t.data);
            if (vistos[k]) return;
            vistos[k] = 1;
            fim.push(t);
          });
          fim.sort((a, b) => a.data - b.data);
          return fim;
        };
        if (dn.testes !== undefined) gravarTestes(id, juntaHist(lerTestes(id), Jp(dn.testes, [])));
        if (dn.pseudoTestes !== undefined) gravarTestesPseudo(id, juntaHist(lerTestesPseudo(id), Jp(dn.pseudoTestes, [])));
        if (dn.frasesTestes !== undefined) gravarTestesFrases(id, juntaHist(lerTestesFrases(id), Jp(dn.frasesTestes, [])));
        // textos já usados: união, pra não repetir sem necessidade
        if (dn.textosUsados !== undefined) {
          const uni = Array.from(new Set(Jp(dn.textosUsados, []).concat(lerTextosUsados(id))));
          localStorage.setItem("corujaFluenciaTextosUsados_" + id, JSON.stringify(uni));
        }
        // idade / série / nível: no dia a dia manda o celular; numa
        // recuperação (perfil novo ou "trazer da nuvem") vem da nuvem
        const perfis = lerPerfis();
        const idx = perfis.findIndex((x) => x.id === id);
        if (idx > -1) {
          let mudou = false;
          ["idade", "serie", "nivelModo", "nivelManual", "nivelAtual"].forEach((campo) => {
            if (dn[campo] === undefined || dn[campo] === null) return;
            if (restaurando || perfis[idx][campo] === undefined || perfis[idx][campo] === null) {
              perfis[idx][campo] = dn[campo];
              mudou = true;
            }
          });
          if (mudou) gravarPerfis(perfis);
        }
        if (perfilAtivo && perfilAtivo.id === id) perfilAtivo = lerPerfis().find((x) => x.id === id) || perfilAtivo;
      }

      function nuvemAtiva() { return !!(window.NuvemSync && NuvemSync.configurada()); }

      function textoStatusNuvem() {
        if (!window.NuvemSync) return { txt: "Desligada (arquivo nuvem-sync.js não encontrado)", cor: "" };
        const st = NuvemSync.status();
        if (!st.configurada) {
          return { txt: window.__nuvemCfgArq === "ok" ? "Desligada: o nuvem-config.js está vazio" : "Desligada: falta o arquivo nuvem-config.js", cor: "" };
        }
        if (st.estado === "sem-codigo") return { txt: "Falta digitar o código da família", cor: "erro" };
        if (st.estado === "offline") return { txt: "📴 Sem internet. " + (st.pendentes ? st.pendentes + " alteração(ões) esperando pra subir. Não limpe os dados do navegador até conectar." : "Tudo em dia."), cor: st.pendentes ? "espera" : "ok" };
        if (st.estado === "enviando") return { txt: "⏳ Enviando para a nuvem...", cor: "espera" };
        if (st.estado === "erro") return { txt: "❌ " + st.detalhe, cor: "erro" };
        if (st.estado === "ok") {
          const h = st.ultimoOk ? new Date(st.ultimoOk) : null;
          return { txt: "✅ Tudo guardado na nuvem" + (h ? " (às " + String(h.getHours()).padStart(2, "0") + ":" + String(h.getMinutes()).padStart(2, "0") + ")" : "") + (st.pendentes ? " — " + st.pendentes + " alteração(ões) na fila" : ""), cor: st.pendentes ? "espera" : "ok" };
        }
        return { txt: "⏳ Preparando...", cor: "espera" };
      }

      function atualizaNuvemUI() {
        const st = textoStatusNuvem();
        const ponto = document.getElementById("nuvemPonto");
        if (ponto) { ponto.className = "nuvem-ponto" + (nuvemAtiva() ? " on " + st.cor : ""); ponto.title = st.txt; }
        const stEl = document.getElementById("cfgNuvemSt");
        if (stEl) stEl.textContent = st.txt;
        const famEl = document.getElementById("cfgNuvemFam");
        if (famEl) {
          const stt = window.NuvemSync ? NuvemSync.status() : {};
          famEl.textContent = !stt.configurada ? "—" : stt.familia ? "Em uso: " + stt.familia.slice(0, 3) + "•••" : "Ainda não digitado";
        }
      }

      function nuvemSincronizarAgora() {
        if (!nuvemAtiva()) { popupAviso("☁️ Nuvem", "A nuvem ainda não foi configurada neste aplicativo."); return; }
        if (!NuvemSync.pronta()) { popupCodigoFamilia(false); return; }
        NuvemSync.sincronizar().then((ok) => {
          atualizaNuvemUI();
          const st = NuvemSync.status();
          popupAviso("☁️ Nuvem", ok ? "✅ Tudo guardado na nuvem!" : st.estado === "offline" ? "📴 Sem internet — fica guardado no celular até voltar a conexão." : "❌ " + (st.detalhe || "Não deu certo. Tente de novo daqui a pouco."));
        });
      }

      /* pop-up bonitinho do código da família — usa o mesmo #modal-popup
         dos outros pop-ups do app (nunca prompt()/alert() do navegador) */

        if (st.temFamiliaNoArquivo) {
          popupAviso("🔑 Código da família", "O código da família já está escrito no arquivo nuvem-config.js. Para trocar, peça para editar aquele arquivo.");

        }

          <div id="cod-fam-icone" style="font-size:2.6rem;line-height:1;margin-bottom:6px">🔑</div>
          <h2 style="color:var(--texto);margin:0 0 8px">Código da família</h2>
          <p class="sub" id="cod-fam-texto">É o mesmo código em todos os aplicativos e em todos os celulares (pelo menos 6 letras ou números, sem espaço).</p>
          <input id="cod-fam-input" type="text" maxlength="40" placeholder="ex.: saopedro2026" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"
            style="font-family:inherit;font-size:clamp(17px,4vh,24px);font-weight:900;text-align:center;letter-spacing:.04em;
            padding:clamp(8px,1.8vh,13px) 14px;border-radius:16px;border:4px solid var(--ouro);background:#fff;color:#1e293b;
            outline:none;width:100%;max-width:320px;margin:8px auto 4px;display:block" />
          <div id="cod-fam-erro" style="color:#ef4444;font-weight:800;font-size:0.85rem;min-height:1.3em;margin:0 0 6px"></div>

      /* recuperação automática: ao abrir um leitor que já existia, traz o
         que outro celular já tiver mandado (nunca apaga nada daqui) */
      function nuvemLevarFichaAntiga(id, nome, av) {
        if (!nuvemAtiva() || !NuvemSync.pronta() || navigator.onLine === false) { try { NuvemSync.marcarPendente(id); } catch (e) {} return; }
        NuvemSync.recuperar(id, nome, av, false).catch(() => {});
      }
      /* ao cadastrar alguém novo com o mesmo nome + bichinho que já existe
         na nuvem (outro celular da família), o progresso volta sozinho */
      function nuvemTentarRecuperarNovo(id, nome, av) {
        if (!nuvemAtiva() || !NuvemSync.pronta() || navigator.onLine === false) return;
        NuvemSync.recuperar(id, nome, av, true).then((achou) => {
          if (!achou) return;
          perfilAtivo = lerPerfis().find((p) => p.id === id) || perfilAtivo;
          if (perfilAtivo && perfilAtivo.id === id) mostrarMenu();
          popupAviso("☁️ Progresso encontrado!", "Achei o progresso de " + esc(nome) + " guardado na nuvem e já trouxe para este celular.");
        }).catch(() => {});
      }

      /* histórico de versões: uma cópia por dia na nuvem, pra "juntar"
         (nunca sobrescreve) com o progresso de agora */
      function mostrarVersoesGuardadas() {
        if (!perfilAtivo) { popupAviso("🕘 Versões guardadas", "Abra um leitor primeiro."); return; }
        if (!nuvemAtiva() || !NuvemSync.pronta()) { popupAviso("🕘 Versões guardadas", "Configure a nuvem e o código da família primeiro."); return; }
        popupAviso("🕘 Versões guardadas", '<p class="sub">Buscando...</p>');
        NuvemSync.listarVersoes(perfilAtivo.nome, perfilAtivo.emoji).then((lista) => {
          if (document.getElementById("modal-popup").style.display !== "flex") return;
          if (!lista.length) { popupAviso("🕘 Versões guardadas", "Ainda não há nenhuma cópia guardada de " + esc(perfilAtivo.nome) + "."); return; }
          const linhas = lista.slice(0, 30).map((v) => `
            <div style="display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--borda-fraca)">
              <span class="sub" style="margin:0">${esc(v.dia)}</span>
              <button class="btn btn-contorno" style="padding:8px 14px" onclick="juntarVersaoGuardada('${esc(v.dia)}')">Juntar</button>
            </div>`).join("");
          document.getElementById("popup-conteudo").innerHTML = `
            <h2 style="color:var(--texto);margin:0 0 10px">🕘 Versões guardadas</h2>
            <p class="sub" style="text-align:left">Uma cópia por dia de ${esc(perfilAtivo.nome)}. "Juntar" mistura aquele dia com o progresso de agora — nada é apagado.</p>
            <div style="max-height:40vh;overflow-y:auto;text-align:left;margin:8px 0">${linhas}</div>
            <button class="btn btn-ouro" style="width:100%;margin-top:8px;padding:14px" onclick="fecharPopup()">Fechar</button>`;
        }).catch((e) => { popupAviso("🕘 Versões guardadas", "❌ Não deu para buscar agora. " + esc((e && e.message) || "")); });
      }
      function juntarVersaoGuardada(dia) {
        if (!perfilAtivo) return;
        NuvemSync.juntarVersao(perfilAtivo.id, perfilAtivo.nome, perfilAtivo.emoji, dia).then((ok) => {
          popupAviso("🕘 Versões guardadas", ok ? "✅ Juntado! O progresso daquele dia foi somado ao de agora." : "❌ Não achei essa versão.");
        }).catch(() => { popupAviso("🕘 Versões guardadas", "❌ Não deu para juntar agora."); });
      }

      /* ===================== 📺 tela sempre acesa (escola-pwa.js) ===================== */
      function atualizaTelaAcesaUI() {
        if (!window.EscolaPWA) return;
        const t = EscolaPWA.telaAcesa.estado();
        const btn = document.getElementById("btn-tela-acesa");
        if (btn) { btn.className = "toggle-pill" + (t.ligada ? " ligado" : ""); btn.textContent = t.ligada ? "Ligado" : "Desligado"; }
        const aviso = document.getElementById("tela-acesa-aviso");
        if (aviso) {
          aviso.textContent = !t.ligada ? "A tela pode apagar sozinha, como de costume."
            : t.modo === "nativo" || t.modo === "reserva" ? "✅ A tela fica acesa enquanto o aplicativo estiver aberto."
            : "⏳ Preparando...";
        }
      }
      function alternarTelaAcesaUI() { if (window.EscolaPWA) { EscolaPWA.telaAcesa.alternar(); atualizaTelaAcesaUI(); } }

      /* ===================== arranque ===================== */
      window.onload = () => {
        mostrarBoasVindas();
        entrarTelaCheia();
        atualizarIconeTelaCheia();
        document.addEventListener("fullscreenchange", atualizarIconeTelaCheia);
        document.addEventListener("webkitfullscreenchange", atualizarIconeTelaCheia);

        // tela sempre acesa + tela cheia contínua + convite de instalar:
        // mesmo módulo compartilhado dos outros aplicativos da família
        if (window.EscolaPWA) {
          EscolaPWA.iniciar({ nome: "Coruja Fluência", icone: "icon-192.png", chaveTelaAcesa: "fluencia_telaAcesa" });
          EscolaPWA.aoMudar(() => { try { atualizaTelaAcesaUI(); } catch (e) {} });
        }

        // nuvem (Firebase): salva e recupera o progresso entre celulares
        if (window.NuvemSync) {
          NuvemSync.aoMudar(() => { try { atualizaNuvemUI(); } catch (e) {} });
          NuvemSync.iniciar({
            app: APP_NUVEM,
            usuarios: () => lerPerfis().map((p) => ({ id: p.id, nome: p.nome, av: p.emoji })),
            idDaChave: nuvemIdDaChave,
            exportar: nuvemExportar,
            mesclar: nuvemMesclar,
          });
        }
        try { atualizaNuvemUI(); atualizaTelaAcesaUI(); } catch (e) {}

        if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
      };

      document.addEventListener("gesturestart", (e) => e.preventDefault());
    </script>
  </body>
</html>
